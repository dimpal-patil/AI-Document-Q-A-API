name: CI

on:
  push:
    branches: [main, develop, test]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: dimpal26
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: docqaexport
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic[email]==2.9.2"

      - name: Create .env file
        run: |
          cat > .env << ENVEOF
DATABASE_URL=postgresql://dimpal26:test1234@postgres:5432/docqaexport
REDIS_URL=redis://redis:6379
OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
SECRET_KEY=${{ secrets.SECRET_KEY }}
ENVEOF

      - name: Create tables
        run: python create_tables.py || echo "Tables may already exist"

      - name: Run tests with DB and Redis mocks
        run: |
          pytest -v --disable-warnings \
            --ds-settings-module=tests.mock_settings